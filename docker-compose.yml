services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://fortis:fortis@db:5432/fortis
      NEXTAUTH_SECRET: change-me-to-32-chars-minimum-ok
      NEXTAUTH_URL: http://localhost:3000
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fortis
      POSTGRES_PASSWORD: fortis
      POSTGRES_DB: fortis
    ports:
      - "5432:5432"
